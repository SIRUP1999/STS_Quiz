<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS Exam Practice — UENR 202</title>
<style>
  :root{
    --paper:#F5EFDD;
    --card:#FFFFFF;
    --ink:#20293A;
    --ink-soft:#5B6472;
    --accent:#B9822E;
    --accent-deep:#8C6220;
    --correct:#2F6F4E;
    --correct-bg:#E7F1EA;
    --incorrect:#A63D2F;
    --incorrect-bg:#F6E7E3;
    --line:#DCD2B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{width:100%;max-width:640px;}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;}
  .brand{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;margin-bottom:22px;
  }
  .brand h1{font-size:23px;letter-spacing:0.2px;}
  .brand span{font-size:12.5px;color:var(--ink-soft);}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 20px;
    margin-bottom:16px;
  }
  /* ---- Home screen ---- */
  .stats-row{display:flex;gap:10px;margin-bottom:18px;}
  .stat{flex:1;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);}
  .stat .num{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--accent-deep);}
  .stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .mode-btn{
    width:100%;text-align:left;
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;margin-bottom:10px;cursor:pointer;
    font-family:inherit;color:var(--ink);
  }
  .mode-btn:hover{border-color:var(--accent);}
  .mode-btn .tag{
    font-family:Georgia,serif;font-weight:700;font-size:15px;
    border:1px solid var(--ink);border-radius:4px;
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    color:var(--ink);
  }
  .mode-btn .txt strong{display:block;font-size:15px;margin-bottom:2px;}
  .mode-btn .txt span{font-size:12.5px;color:var(--ink-soft);}
  .history{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  /* ---- Quiz screen ---- */
  .progress-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--ink-soft);}
  .ticks{display:flex;gap:3px;margin-bottom:20px;flex-wrap:wrap;}
  .tick{height:5px;flex:1;min-width:4px;background:var(--line);border-radius:2px;}
  .tick.done{background:var(--accent);}
  .qprompt{font-size:17px;line-height:1.45;margin-bottom:18px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:9px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);
    line-height:1.4;
  }
  .opt:hover{border-color:var(--accent);}
  .opt .letter{
    font-family:Georgia,serif;font-weight:700;font-size:13px;
    border:1px solid var(--ink-soft);border-radius:4px;
    width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .opt.selected-correct{background:var(--correct-bg);border-color:var(--correct);}
  .opt.selected-correct .letter{border-color:var(--correct);color:var(--correct);}
  .opt.selected-incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);}
  .opt.selected-incorrect .letter{border-color:var(--incorrect);color:var(--incorrect);}
  .opt.reveal-correct{border-color:var(--correct);}
  .opt.locked{cursor:default;}
  .feedback{margin-top:14px;padding:14px 16px;border-radius:6px;font-size:13.5px;line-height:1.5;}
  .feedback.good{background:var(--correct-bg);color:var(--correct);}
  .feedback.bad{background:var(--incorrect-bg);color:var(--incorrect);}
  .feedback b{display:block;margin-bottom:4px;font-size:13.5px;}
  .btn{
    background:var(--ink);color:var(--paper);border:none;border-radius:6px;
    padding:12px 20px;font-size:14.5px;cursor:pointer;font-family:inherit;font-weight:600;
  }
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  /* ---- Results screen ---- */
  .score-hero{text-align:center;padding:26px 10px;}
  .score-hero .big{font-family:Georgia,serif;font-size:52px;font-weight:700;color:var(--accent-deep);}
  .score-hero .pct{font-size:15px;color:var(--ink-soft);margin-top:4px;}
  .score-msg{font-size:14.5px;text-align:center;margin-top:8px;padding:0 10px;}
  .review-item{border-top:1px solid var(--line);padding:14px 0;}
  .review-item:first-child{border-top:none;}
  .review-item .q{font-size:14px;margin-bottom:6px;}
  .review-item .ans{font-size:13px;line-height:1.5;}
  .review-item .ans .you{color:var(--incorrect);}
  .review-item .ans .right{color:var(--correct);}
  .review-item .exp{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .empty-review{font-size:13.5px;color:var(--ink-soft);text-align:center;padding:10px 0;}
  .section-title{font-size:13px;text-transform:none;color:var(--ink-soft);margin:4px 0 10px;font-weight:600;}
  .footer-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:26px;}
  .loading{text-align:center;padding:30px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- QUESTION BANK (120) ---------------- */
const BANK = [
{p:"Deforestation contributes to climate change primarily by...",o:["Reducing the amount of oxygen in the atmosphere","Lowering global sea levels","Decreasing the Earth's ability to sequester carbon dioxide","Increasing rainfall in tropical regions"],c:2,e:"Trees absorb and store CO2. Removing them reduces the planet's carbon sink capacity."},
{p:"A country has a largely subsistence farming economy, minimal international trade, and limited scientific engagement. Which Rostow stage is this?",o:["Take-off","Traditional society","Preconditions to take-off","Drive to maturity"],c:1,e:"Traditional Society is defined by subsistence agriculture, little trade, pre-scientific production."},
{p:"A policymaker boosts industrial production but ignores sustainable consumption and environmental protection. Which SDG 'P' is neglected?",o:["People","Planet","Peace","Partnership"],c:1,e:"The 5 P's are People, Planet, Prosperity, Peace, Partnership. Ignoring environment neglects 'Planet'."},
{p:"Which shows the five time frames of Technology?",o:["Obsolete, current, coexisting, emerging and new","Current, coexisting, obsolete, advanced and emerging","Goal, input, process, output and feedback","Input, process, output, feedback and goal"],c:0,e:"Technology's life cycle: obsolete, current, coexisting, emerging, and new."},
{p:"A landslide strips away vegetation on a mountainside. How does this contribute to climate change?",o:["By increasing Earth's orbital distance from the Sun","By reducing carbon sequestration capacity of soil and vegetation","By producing more solar radiation","By increasing surface albedo permanently"],c:1,e:"Vegetation and healthy soil store carbon; stripping it reduces the land's ability to absorb CO2."},
{p:"Who is credited for improving steam power, crucial in the Industrial Revolution?",o:["Richard Arkwright","James Watt","Henry Bessemer","George Stephenson"],c:1,e:"James Watt significantly improved steam engine efficiency, powering factories and machinery."},
{p:"Which greenhouse gas is most strongly linked to livestock digestion?",o:["Nitrous oxide (N2O)","Methane (CH4)","Sulphur dioxide (SO2)","Carbon dioxide (CO2)"],c:1,e:"Ruminants like cattle produce methane through enteric fermentation."},
{p:"Which invention is associated with the early textile industry?",o:["Spinning jenny and power loom","Steam engine and Bessemer process","Railways and steamships","Cotton gin and assembly line"],c:0,e:"The spinning jenny and power loom mechanized early textile production."},
{p:"Which BEST captures neoliberalism's core belief about markets and government?",o:["The market needs constant government intervention to remain fair","Markets are inherently efficient, while governments are prone to inefficiency and overreach","Governments and markets should share equal control over production decisions","Markets are only efficient when state-owned enterprises dominate"],c:1,e:"Neoliberalism holds that free markets allocate resources efficiently, while intervention distorts this."},
{p:"A fisheries ministry caps catch sizes, protects spawning grounds, and funds ghost-net removal. Which primary SDG is targeted?",o:["Goal 15","Goal 12","Goal 16","Goal 14"],c:3,e:"SDG 14 is 'Life Below Water', covering conservation of oceans and marine resources."},
{p:"What is the primary purpose of a technological system?",o:["To create more complex systems","To achieve a particular goal or purpose","To eliminate the need for human intervention","To generate random outputs"],c:1,e:"A technological system exists to accomplish a specific, intended goal."},
{p:"A policymaker claims modern AI is 'unprecedented'. Which historical analogy best helps anticipate AI's challenges/opportunities?",o:["The shift from bronze to iron tools","Faraday's work on electricity","Development of gunpowder in China","Industrial Revolution's mechanization of labour"],c:3,e:"The Industrial Revolution triggered similar labour displacement, productivity gains, and social change."},
{p:"A city deploys AI for traffic policing. An STS-aligned advisory panel should FIRST do which of the following?",o:["Map stakeholders and co-design governance goals","Approve pilot use if accuracy exceeds 95%","Ask engineers to open-source the code and proceed","Defer to the vendor's ethical guidelines"],c:0,e:"STS prioritizes identifying affected stakeholders and jointly shaping governance before deployment."},
{p:"The five cardinal themes of the SDGs are...",o:["People, planet, prosperity, peace and partnership","People, planet, production, prosperity and peace","People, peace, planet, partnership and production","Peace, people, prosperity, planet and protection"],c:0,e:"The SDGs are built around the '5 Ps': People, Planet, Prosperity, Peace, and Partnership."},
{p:"A government invests in wind turbines alongside continued coal energy plants. This is best classified as...",o:["Coexisting technologies","Obsolete technologies","New technologies only","Conflicting technologies"],c:0,e:"An older technology (coal) operating alongside a newer one (wind) is described as coexisting."},
{p:"Which factor would MOST increase consumer availability in an industrial economy?",o:["Sudden drop in birth rate","Closure of transportation networks","Migration to cities and rising population","Elimination of trade opportunities"],c:2,e:"Urban migration and population growth boost labour force and demand, increasing goods available."},
{p:"Which scenario best represents 'preconditions to take-off' in Rostow's model?",o:["Emergence of manufacturing and growing international economic connections","Widespread consumer culture and mass production","Economy dominated by manual farming with no manufacturing","Long-term diversification of industries and technologies"],c:0,e:"This stage is marked by early manufacturing and expanding trade links, beyond pure subsistence."},
{p:"Which scenario shows a natural cause of climate change with a potential COOLING effect?",o:["Expansion of cattle farming in tropical regions","Volcanic eruption releasing ash clouds that block sunlight","Combustion of coal for electricity generation","Deforestation in the Amazon Basin"],c:1,e:"Volcanic ash and aerosols can block sunlight, temporarily cooling the climate."},
{p:"According to John Locke, under what condition are people obligated to obey civil government?",o:["As long as the government maintains public order","If the government provides economic stability","Only if the government is democratically elected","When the government protects the natural rights of each individual, including private property"],c:3,e:"Locke argued government's legitimacy rests on protecting natural rights — life, liberty, and property."},
{p:"A factory increases production by burning more coal. Which primary greenhouse gas is released?",o:["Methane (CH4)","Nitrous oxide (N2O)","Carbon dioxide (CO2)","Sulphur dioxide (SO2)"],c:2,e:"Burning coal (a fossil fuel) primarily releases carbon dioxide."},
{p:"Neoliberal advocates argue that 'the consumer is king' primarily because...",o:["Competition forces producers to meet consumer demand in price and quality","Consumers can vote for policies that benefit them economically","State-owned enterprises respond better to consumer preferences","Governments regulate markets to ensure consumer dominance"],c:0,e:"In free-market theory, competition forces producers to cater to consumer preferences."},
{p:"Boateng's ecological conservation project has helped Ghana achieve which SDG?",o:["Affordable Energy","Climate Action","Planet","Peace"],c:1,e:"Ecological conservation efforts most directly align with SDG 13: Climate Action."},
{p:"What does 'adaptation' mean in the context of climate change?",o:["Reducing greenhouse gas emissions to slow climate change","Increasing industrial activities to boost economic growth","Adjusting human and natural systems in response to actual or expected climate effects","Ignoring climate change and continuing current practices"],c:2,e:"Adaptation means adjusting practices/systems in response to actual or expected climate impacts."},
{p:"The use of flour as medicine (penicillin precursor) in ancient civilization was from:",o:["Egypt","Greece","China","India"],c:0,e:"Ancient Egyptians used mouldy bread and flour-based preparations as early medicinal remedies."},
{p:"What significant change accompanied urbanization during the Industrial Revolution?",o:["Decrease in city population","Growth in cities and their associated cost of living","The decline of industrial activities","The establishment of rural communities"],c:1,e:"Factories drew workers into cities, swelling urban populations and driving up cost of living."},
{p:"The global recession of the early 1980s led to a reduction in ... for third-world countries.",o:["Export earnings","Foreign Aid","Import earnings","Domestic Investment earnings"],c:0,e:"The recession reduced global demand for commodities, cutting export revenues many economies relied on."},
{p:"Transitioning to renewable energy must be accompanied by policies addressing economic displacement of workers in ... industries.",o:["Agricultural","Fossil Fuel","Textile","Service"],c:1,e:"Moving away from fossil fuels threatens jobs in fossil fuel extraction and processing."},
{p:"Combining rising living standards and diversification of the economy best describes the ... stage.",o:["Pre-industrial","Take-off","Drive to Maturity","High Mass Consumption"],c:2,e:"'Drive to Maturity' features economic diversification and rising living standards."},
{p:"A satellite mission needs to predict slingshot manoeuvres around Earth and the Moon. Whose conceptual toolkit is most essential?",o:["Descartes' dualism","Rousseau's general will","Newton's universal gravitation and laws of motion","Voltaire's satire"],c:2,e:"Gravitational slingshot manoeuvres are calculated using Newton's laws of motion and gravitation."},
{p:"Another term for harmful heat-trapping gases is ...",o:["Global warming gases","Greenhouse gases","Depletion gases","Saturated gases"],c:1,e:"Harmful atmospheric gases that trap heat are commonly called greenhouse gases."},
{p:"Which is a likely political risk of prolonged dependence on IMF bailouts?",o:["Strengthened domestic policy autonomy","Increased parliamentary oversight","No changes in governance","Perception of reduced sovereignty and domestic policy control"],c:3,e:"Extended reliance on IMF support ties domestic policy to external conditions."},
{p:"Any process, concept, or practice that enhances human activities through satisfaction of human needs is known as?",o:["Development","Science","Technology","Goals"],c:2,e:"This is the standard definition of technology — practices/tools applied to meet human needs."},
{p:"Why was Africa's economic structure particularly vulnerable during the 1980s debt crisis?",o:["Heavy dependence on volatile primary commodity exports","Excessive diversification into manufacturing","Dominance of regional trade blocs instead of global markets","Widespread adoption of renewable energy sources"],c:0,e:"Reliance on a narrow range of raw commodity exports made economies exposed to price swings."},
{p:"Which climate change impact has the most immediate effect on biodiversity loss?",o:["Gradual urban expansion","Destruction of ecosystems","Rising electricity prices","Decreased international trade"],c:1,e:"Direct destruction of ecosystems immediately removes habitats, causing fastest biodiversity loss."},
{p:"The implementation period of the UN's Sustainable Development Goals is....?",o:["15 years","20 years","30 years","10 years"],c:0,e:"The SDGs run from 2015 to 2030, a 15-year implementation period."},
{p:"What role do solar variations play in climate change?",o:["They decrease global temperatures","They have no impact on global temperatures","They can lead to higher or lower temperatures depending on the sun's energy output","They primarily increase greenhouse gas emissions"],c:2,e:"Fluctuations in solar output can warm or cool the climate depending on energy output."},
{p:"Which sector combines both direct GHG emissions and indirect ecosystem destruction?",o:["Solar power generation","Offshore wind farms","Recycling industries","Commercial agriculture involving land clearing"],c:3,e:"Agriculture emits GHGs directly (methane, fertiliser) and indirectly through land clearing."},
{p:"The short term conditions of the atmosphere is known as...",o:["Climate","Temperature","Weather","Atmospheric condition"],c:2,e:"Weather refers to short-term atmospheric conditions; climate is the long-term pattern."},
{p:"If glaciers continue melting in Polar Regions, which social effect is most likely?",o:["Reduced volcanic activity in cities","Lower global population growth rates","Stabilization of precipitation patterns in rural areas","Relocation of coastal populations due to sea level rise"],c:3,e:"Melting glaciers raise sea levels, threatening coastal settlements and forcing relocation."},
{p:"How did the Industrial Revolution impact standards of living?",o:["It uniformly improved standards of living for all","It worsened the living conditions for everyone","It improved standards for some but created harsh conditions for workers","It had no impact on standards of living"],c:2,e:"Wealth and goods increased overall, but factory workers endured poor wages and unsafe conditions."},
{p:"'Rearing livestock is as much of a climate threat as transport.' Which reasoning supports this?",o:["Livestock absorb CO2 during digestion","Livestock cause solar variation","Transport emits methane from tailpipes","Livestock produce large amounts of methane and nitrous oxide"],c:3,e:"Livestock farming is a major source of methane and nitrous oxide, potent greenhouse gases."},
{p:"Overfishing threatens local fishing communities. What is the best approach to conserve marine resources?",o:["Implement and enforce sustainable fishing practices","Increase fishing quotas to boost short-term profits","Encourage advanced fishing technology to catch more fish","Ban all fishing activities indefinitely"],c:0,e:"Sustainable fishing balances current livelihoods with long-term conservation of fish stocks."},
{p:"The Rio+20 conference influenced the post-2015 development agenda primarily by...",o:["Ending the MDGs early","Calling for global goals integrating environmental sustainability with economic/social development","Prioritizing military alliances over development","Limiting the number of global development goals"],c:1,e:"Rio+20 laid groundwork for the SDGs by pushing goals uniting environmental, economic, social sustainability."},
{p:"Which is an example of a long-term adaptation strategy for climate change effects?",o:["Increasing fossil fuel consumption","Enhancing agricultural practices to cope with changing climate conditions","Continuing current transportation methods without change","Expanding urban areas without considering environmental impact"],c:1,e:"Adapting agricultural methods to withstand changing climate is a proactive, long-term strategy."},
{p:"The ... is the sequence of actions that a system undergoes.",o:["Process","Output","Feedback","Goal"],c:0,e:"'Process' is the sequence of actions a system carries out to convert input into output."},
{p:"A nation invests in mass education, builds factories, and promotes exports over a short period. Which Rostow stage is this?",o:["Age of high mass consumption","Take-off","Drive to maturity","Traditional society"],c:1,e:"'Take-off' is characterized by rapid industrialization, rising investment, and expanding exports."},
{p:"STS aims to integrate personal understanding of the ... environment.",o:["Social, Technological and Natural","Social, Technical and Sustainable","Scientific, Technical and Social","Skills, Technology and Natural"],c:2,e:"STS integrates the scientific, technical, and social dimensions of everyday life."},
{p:"A city prone to flooding wants to become resilient. What should the government do?",o:["Construct more buildings in flood-prone areas to meet housing demand","Develop green infrastructure such as parks and wetlands to absorb floodwaters","Ignore climate risks and focus on short-term economic growth","Relocate the entire population to a different region"],c:1,e:"Green infrastructure like wetlands and parks naturally absorbs excess water."},
{p:"Which situation reflects the goal of TECHNOLOGY rather than the goal of science?",o:["Explaining the chemical reactions in battery storage","Predicting weather patterns based on atmospheric data","Designing a low-cost water filtration system for rural communities","Understanding the genetic code of a rare plant species"],c:2,e:"Technology aims to solve practical problems; the other options are explaining/understanding (science)."},
{p:"A forested area is cleared for agriculture, causing biodiversity loss. Best strategy to restore terrestrial ecosystems?",o:["Allow unrestricted deforestation to boost agricultural production","Focus on short-term economic gains without considering environment","Convert all forest land into urban areas","Implement sustainable land management practices and reforestation programs"],c:3,e:"Sustainable land management and reforestation directly restore ecosystems while balancing development."},
{p:"Which is the correct word order for STS?",o:["Society, Technology and Science","Science, Technology and Society","Science and Technology, Society","Science and Technology and Society"],c:1,e:"STS stands for Science, Technology and Society, in that order."},
{p:"The Fourth Industrial Revolution (2000) is characterized by...",o:["Internet and Renewable Energy","Electronics and Nuclear Energy","Coal and Gas Energy","Internet and Gas Energy"],c:0,e:"The Fourth Industrial Revolution is marked by digital connectivity alongside renewable energy."},
{p:"An engineer wants transportation network design inspired by ancient achievements. Which pairing is most relevant?",o:["Papermaking and gunpowder","Roman roads and Mesopotamian wheel","Aristotle's philosophy and da Vinci's paintings","Maxwell's equations and Sputnik"],c:1,e:"Roman roads and the Mesopotamian wheel are foundational transportation-related innovations."},
{p:"Which critique of modernization theory is most valid from an STS perspective?",o:["It assumes Western capitalist models are the only valid path to development","It ignores the role of technology entirely","It underestimates the importance of economic growth","It applies only to post-industrial economies"],c:0,e:"A key STS critique is modernization theory's Western-centric bias assuming one capitalist path."},
{p:"A government builds desalination plants for affordable drinking water in rural areas. Which SDG target?",o:["Increase renewable energy in the global mix","Achieve universal and equitable access to safe and affordable drinking water","Ensure access to safe, affordable housing and drinking water","Reduce inequality among countries with quality drinking water"],c:1,e:"This matches SDG 6's target of universal, equitable access to safe drinking water."},
{p:"The following are examples of Ancient Civilization EXCEPT......",o:["Egypt","China","Britain","Mesopotamia"],c:2,e:"Egypt, China, and Mesopotamia are classical ancient civilizations; Britain is not typically classified among them."},
{p:"A rural community lacks reliable electricity. Most sustainable approach for affordable, reliable energy?",o:["Build a large coal-fired power plant","Provide the community with diesel generators","Implement a solar energy project with battery storage","Encourage reliance on traditional biomass"],c:2,e:"Solar with battery storage provides clean, sustainable, reliable power for off-grid settings."},
{p:"A regional initiative builds high-speed rail between two neighbouring countries, improving trade and commuting. Which SDG target?",o:["Universal access to rail transport","Universal communication system","Increase renewable energy share","Sustainable and resilient trans-border infrastructure"],c:3,e:"Cross-border rail infrastructure boosting trade/connectivity aligns with SDG 9's resilient infrastructure focus."},
{p:"Which factor is classified as a long-term natural driver of Earth's climate variation?",o:["Expansion of urban road networks","Increased use of synthetic fertilizers","The digestive emissions of ruminants","Cyclical changes in Earth's orbital shape over centuries"],c:3,e:"Long-term orbital cycles (Milankovitch cycles) are a natural, long-term driver of climate variation."},
{p:"A developing country struggles to meet SDGs due to lack of resources. How can the international community assist?",o:["Impose trade restrictions to encourage self-sufficiency","Reduce the number of SDGs for the country","Require repayment of aid before receiving more assistance","Strengthen global partnerships via financial aid, tech transfer, and capacity building"],c:3,e:"SDG 17 (Partnerships) calls for cooperation through aid, technology transfer, and capacity building."},
{p:"How do industrial activities intensify climate change?",o:["They increase solar variation","They strengthen Earth's magnetic field","They add to greenhouse gases","They reduce the effects of volcanic ash clouds"],c:2,e:"Industrial processes burn fossil fuels and release greenhouse gases, intensifying the greenhouse effect."},
{p:"The era 1750–1850 is associated with the transition from what type of economies?",o:["Subsistence economies to market economies","Industrial economies to post-industrial economies","Colonial economies to independent economies","Agrarian economies to industrial economies"],c:3,e:"This period, the Industrial Revolution, marked the shift from agrarian to industrial economies."},
{p:"A farmer increases nitrogen-based fertilizer use. Which greenhouse gas is most directly associated?",o:["Carbon dioxide (CO2)","Nitrous oxide (N2O)","Methane (CH4)","Ozone (O3)"],c:1,e:"Nitrogen-based fertilizers release nitrous oxide through microbial processes in soil."},
{p:"Which Washington Consensus policy directly aims to attract foreign companies to a developing country?",o:["Tax reform","Fiscal discipline","Promotion of foreign direct investment","Protection of property rights"],c:2,e:"The Washington Consensus explicitly promotes FDI as a policy to attract foreign companies."},
{p:"Solar power and wind energy are examples of ...",o:["Nanotechnology","Renewable Energy","Non-renewable Energy","Atmospheric Energy"],c:1,e:"Solar and wind are naturally replenished sources of power — renewable energy."},
{p:"Decline in agricultural productivity in Ghana due to climate changes could lead to ...",o:["Food security","Food variability","Food insecurity","Food variation"],c:2,e:"Reduced agricultural output directly threatens reliable food availability, leading to food insecurity."},
{p:"Which BEST describes Structural Adjustment Programmes (SAPs) promoted by IMF/World Bank?",o:["They provided unconditional grants for infrastructure","They required market-oriented reforms in exchange for loans","They were short-term humanitarian relief packages","They focused on increasing tariffs to protect domestic industries"],c:1,e:"SAPs were loan packages conditioned on debtor countries adopting market-oriented economic reforms."},
{p:"Zoomlion Ghana's mechanism to boost the economy through cleaner cities addresses which SDG?",o:["SDG 11","SDG 7","SDG 6","SDG 3"],c:0,e:"SDG 11 focuses on Sustainable Cities and Communities, including clean urban environments."},
{p:"Kwabena Musa maintained his industry during the first industrial revolution with the help of .... for power generation.",o:["Electricity","Coal","Steam","Wind"],c:2,e:"The First Industrial Revolution was powered primarily by steam engines, fuelled by coal."},
{p:"The rise in temperature leading to prolonged dry spells is termed as...",o:["Draught","Desert","Drought","Glaciers"],c:2,e:"A prolonged period of abnormally low rainfall and rising temperatures is defined as a drought."},
{p:"How did the government support businesses during 1750-1850?",o:["By eliminating taxes on all businesses","By providing subsidies for agricultural activities","By making capital markets available for businesses","By reducing the regulation of financial markets"],c:2,e:"Governments supported growth by facilitating access to capital markets for businesses to raise funds."},
{p:"One key issue in the global financial system is lack of ... in how credit ratings are assigned to developing countries.",o:["Transparency","Consistency","Fairness","Speed"],c:0,e:"Critics point to a lack of transparency in how credit rating agencies assess developing countries."},
{p:"Which is a structural cause of Africa's vulnerability to debt distress?",o:["Fall in government annual spending","Temporary fall in tourist arrivals","Dependence on a narrow range of primary commodity exports","Single debt default by a neighbouring country"],c:2,e:"Reliance on a narrow set of raw commodity exports is a deep, structural vulnerability."},
{p:"The 'Green Ghana' initiative of the government is primarily focused on...",o:["Promoting agriculture in the country","Promoting the use of renewable energy","Promoting afforestation to reduce carbon footprints","Promoting technology in agriculture"],c:2,e:"Green Ghana is a national tree-planting (afforestation) initiative to restore forest cover."},

/* ---------------- STORAGE HELPERS ---------------- */
const ATTEMPTS_KEY = 'sts-attempts';
const STATS_KEY = 'sts-qstats';

async function loadAttempts(){
  try{ const r = await window.storage.get(ATTEMPTS_KEY, false); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveAttempts(arr){
  try{ await window.storage.set(ATTEMPTS_KEY, JSON.stringify(arr), false); }catch(e){}
}
async function loadStats(){
  try{ const r = await window.storage.get(STATS_KEY, false); return r ? JSON.parse(r.value) : {}; }
  catch(e){ return {}; }
}
async function saveStats(obj){
  try{ await window.storage.set(STATS_KEY, JSON.stringify(obj), false); }catch(e){}
}

/* ---------------- APP STATE ---------------- */
let state = { screen:'loading', attempts:[], stats:{}, quiz:null };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildQuizSet(mode){
  let idxs;
  if(mode==='full'){
    idxs = BANK.map((_,i)=>i);
  } else if(mode==='quick'){
    idxs = shuffle(BANK.map((_,i)=>i)).slice(0,20);
  } else if(mode==='weak'){
    const scored = BANK.map((_,i)=>{
      const s = state.stats[i];
      const w = (!s || s.seen===0) ? 0.4 : (s.correct/s.seen);
      return {i,w};
    });
    scored.sort((a,b)=>a.w-b.w);
    idxs = scored.slice(0, Math.min(20, BANK.length)).map(x=>x.i);
    idxs = shuffle(idxs);
  }
  const questions = idxs.map(i=>{
    const q = BANK[i];
    const optOrder = shuffle(q.o.map((_,k)=>k));
    const options = optOrder.map(k=>q.o[k]);
    const correctIdx = optOrder.indexOf(q.c);
    return { bankIdx:i, prompt:q.p, options, correctIdx, explanation:q.e };
  });
  return { mode, questions, current:0, answers:[], locked:false, selected:null };
}

async function startQuiz(mode){
  state.quiz = buildQuizSet(mode);
  state.screen = 'quiz';
  render();
}

function selectOption(optIdx){
  const q = state.quiz.questions[state.quiz.current];
  if(state.quiz.locked) return;
  state.quiz.locked = true;
  state.quiz.selected = optIdx;
  const correct = optIdx === q.correctIdx;
  state.quiz.answers[state.quiz.current] = { selected:optIdx, correct };
  // update stats
  const bi = q.bankIdx;
  if(!state.stats[bi]) state.stats[bi] = {seen:0, correct:0};
  state.stats[bi].seen++;
  if(correct) state.stats[bi].correct++;
  saveStats(state.stats);
  render();
}

function nextQuestion(){
  if(state.quiz.current < state.quiz.questions.length-1){
    state.quiz.current++;
    state.quiz.locked = false;
    state.quiz.selected = null;
    render();
  } else {
    finishQuiz();
  }
}

async function finishQuiz(){
  const total = state.quiz.questions.length;
  const score = state.quiz.answers.filter(a=>a && a.correct).length;
  const attempt = { date:new Date().toISOString(), mode:state.quiz.mode, score, total };
  state.attempts.push(attempt);
  await saveAttempts(state.attempts);
  state.screen = 'results';
  render();
}

function backToMenu(){
  state.screen = 'home';
  state.quiz = null;
  render();
}

function retake(){
  startQuiz(state.quiz.mode);
}

/* ---------------- RENDER ---------------- */
function modeLabel(m){
  return m==='full' ? 'Full Exam (120)' : m==='quick' ? 'Quick Practice (20)' : 'Weak Spots (20)';
}

function scoreMessage(pct){
  if(pct>=90) return "Excellent — this material is locked in.";
  if(pct>=75) return "Solid. A bit more review on the missed ones and you're set.";
  if(pct>=60) return "Getting there. Review the misses below before your next attempt.";
  return "Worth another full pass — review each explanation below carefully.";
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='loading'){
    app.innerHTML = '<div class="loading">Loading your practice history…</div>';
    return;
  }
  if(state.screen==='home'){
    const best = state.attempts.length ? Math.max(...state.attempts.map(a=>Math.round(100*a.score/a.total))) : null;
    const last = state.attempts.length ? state.attempts[state.attempts.length-1] : null;
    app.innerHTML = `
      <div class="brand"><h1>STS Exam Practice</h1><span>UENR 202 · 120-question bank</span></div>
      <div class="stats-row">
        <div class="stat"><div class="num">${state.attempts.length}</div><div class="lbl">Attempts</div></div>
        <div class="stat"><div class="num">${best!==null?best+'%':'—'}</div><div class="lbl">Best score</div></div>
        <div class="stat"><div class="num">${last?Math.round(100*last.score/last.total)+'%':'—'}</div><div class="lbl">Last score</div></div>
      </div>
      <button class="mode-btn" onclick="startQuiz('full')">
        <div class="tag">120</div>
        <div class="txt"><strong>Full Exam</strong><span>All 120 questions, shuffled options, exam conditions</span></div>
      </button>
      <button class="mode-btn" onclick="startQuiz('quick')">
        <div class="tag">20</div>
        <div class="txt"><strong>Quick Practice</strong><span>20 random questions — good for a short session</span></div>
      </button>
      <button class="mode-btn" onclick="startQuiz('weak')">
        <div class="tag">⚡</div>
        <div class="txt"><strong>Weak Spots</strong><span>Prioritizes questions you've gotten wrong before</span></div>
      </button>
      <div class="history">Your progress is saved on this device — come back anytime.</div>
    `;
    return;
  }
  if(state.screen==='quiz'){
    const qz = state.quiz;
    const q = qz.questions[qz.current];
    const ticks = qz.questions.map((_,i)=>`<div class="tick ${i<qz.current || (i===qz.current && qz.locked) ?'done':''}"></div>`).join('');
    let optsHtml = q.options.map((opt,i)=>{
      let cls = 'opt';
      if(qz.locked){
        cls += ' locked';
        if(i===q.correctIdx) cls += ' selected-correct reveal-correct';
        else if(i===qz.selected) cls += ' selected-incorrect';
      }
      return `<button class="${cls}" onclick="selectOption(${i})" ${qz.locked?'disabled':''}>
        <div class="letter">${String.fromCharCode(65+i)}</div>
        <div>${opt}</div>
      </button>`;
    }).join('');
    let feedback = '';
    if(qz.locked){
      const wasCorrect = qz.answers[qz.current].correct;
      feedback = `<div class="feedback ${wasCorrect?'good':'bad'}">
        <b>${wasCorrect?'Correct.':'Not quite.'}</b>${q.explanation}
      </div>`;
    }
    app.innerHTML = `
      <div class="brand"><h1>STS Exam Practice</h1><span>${modeLabel(qz.mode)}</span></div>
      <div class="progress-wrap"><span>Question ${qz.current+1} of ${qz.questions.length}</span></div>
      <div class="ticks">${ticks}</div>
      <div class="card">
        <div class="qprompt">${q.prompt}</div>
        ${optsHtml}
        ${feedback}
        <div class="btn-row">
          <button class="btn ghost" onclick="backToMenu()">Exit</button>
          <button class="btn" onclick="nextQuestion()" ${qz.locked?'':'disabled'}>${qz.current===qz.questions.length-1?'Finish & Grade':'Next'}</button>
        </div>
      </div>
    `;
    return;
  }
  if(state.screen==='results'){
    const qz = state.quiz;
    const total = qz.questions.length;
    const score = qz.answers.filter(a=>a && a.correct).length;
    const pct = Math.round(100*score/total);
    const missed = qz.questions.map((q,i)=>({q,a:qz.answers[i]})).filter(x=>!x.a.correct);
    let reviewHtml = missed.length ? missed.map(x=>`
      <div class="review-item">
        <div class="q">${x.q.prompt}</div>
        <div class="ans"><span class="you">Your answer: ${x.q.options[x.a.selected]}</span><br><span class="right">Correct: ${x.q.options[x.q.correctIdx]}</span></div>
        <div class="exp">${x.q.explanation}</div>
      </div>
    `).join('') : '<div class="empty-review">No misses — clean sweep.</div>';
    app.innerHTML = `
      <div class="brand"><h1>STS Exam Practice</h1><span>${modeLabel(qz.mode)} — Results</span></div>
      <div class="card score-hero">
        <div class="big">${score} / ${total}</div>
        <div class="pct">${pct}%</div>
        <div class="score-msg">${scoreMessage(pct)}</div>
      </div>
      <div class="btn-row" style="justify-content:center;margin-bottom:20px;">
        <button class="btn ghost" onclick="backToMenu()">Back to menu</button>
        <button class="btn" onclick="retake()">Retake this mode</button>
      </div>
      <div class="card">
        <div class="section-title">Review (${missed.length} missed)</div>
        ${reviewHtml}
      </div>
      <div class="footer-note">Scores are saved automatically. Come back anytime to practice again.</div>
    `;
    return;
  }
}

/* ---------------- INIT ---------------- */
(async function init(){
  state.attempts = await loadAttempts();
  state.stats = await loadStats();
  state.screen = 'home';
  render();
})();
</script>
