<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS Exam Prep — Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2b26;
  --paper:#f4efe1;
  --paper-dim:#ece4cf;
  --forest:#1f3a34;
  --forest-deep:#152a25;
  --amber:#d98e2b;
  --amber-deep:#b6721a;
  --teal:#3f8a7c;
  --coral:#c0473a;
  --line: rgba(28,43,38,0.18);
  --shadow: 0 10px 30px rgba(21,42,37,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--forest-deep);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(63,138,124,0.25), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(217,142,43,0.15), transparent 40%);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: 32px 16px 64px;
}
.app{
  width:100%;
  max-width: 760px;
}
.brandbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color: var(--paper);
  margin-bottom: 18px;
  padding: 0 4px;
}
.brandbar .mark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:0.02em;
  opacity:0.92;
}
.brandbar .mark span{ color: var(--amber); }
.brandbar .who{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  opacity:0.75;
}
.sheet{
  background: var(--paper);
  border-radius: 18px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(0,0,0,0.06);
  position: relative;
  overflow:hidden;
}
.sheet::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:8px;
  background: repeating-linear-gradient(90deg, var(--forest) 0 22px, var(--amber) 22px 26px, var(--forest) 26px 48px);
  opacity:0.9;
}
.sheet-inner{ padding: 40px 36px 34px; }
@media (max-width:600px){ .sheet-inner{ padding: 28px 20px 26px; } }

.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color: var(--teal);
  font-weight:600;
  margin-bottom:10px;
}
h1.title{
  font-family:'Fraunces', serif;
  font-weight:900;
  font-size: 32px;
  line-height:1.12;
  margin: 0 0 10px;
  color: var(--forest-deep);
}
p.lede{
  font-size:15px;
  line-height:1.6;
  color: rgba(28,43,38,0.75);
  margin: 0 0 26px;
  max-width: 46ch;
}

/* -------- Name entry -------- */
.field-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color: var(--forest);
  display:block;
  margin-bottom:8px;
}
input.textfield{
  width:100%;
  font-family:'Fraunces', serif;
  font-size:22px;
  padding: 14px 16px;
  border-radius:10px;
  border: 1.5px solid var(--line);
  background: #fffdf7;
  color: var(--forest-deep);
  outline:none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input.textfield:focus{ border-color: var(--amber); box-shadow: 0 0 0 4px rgba(217,142,43,0.15); }

.btn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14.5px;
  border:none;
  cursor:pointer;
  border-radius: 999px;
  padding: 13px 26px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--forest); color: var(--paper); box-shadow: 0 6px 16px rgba(31,58,52,0.35); }
.btn-primary:hover{ background: var(--forest-deep); }
.btn-amber{ background: var(--amber); color: var(--forest-deep); box-shadow: 0 6px 16px rgba(217,142,43,0.35); }
.btn-amber:hover{ background: var(--amber-deep); }
.btn-ghost{ background: transparent; color: var(--forest); border: 1.5px solid var(--line); }
.btn-ghost:hover{ background: rgba(31,58,52,0.06); }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }
.btn-row{ margin-top: 22px; display:flex; gap:10px; flex-wrap:wrap; }

/* -------- Menu -------- */
.welcome-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin-bottom: 4px;
}
.welcome-row .who-name{ color: var(--amber-deep); }
.changer{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color: var(--teal);
  background:none; border:none; cursor:pointer; text-decoration:underline;
  padding:0;
}
.slide-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top: 22px; }
.slide-card{
  display:flex; flex-direction:column;
  background:#fffdf7;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding: 18px;
  text-align:left;
  transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  min-height: 190px;
  cursor: pointer;
}
.slide-card:hover{ border-color: var(--amber); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(31,58,52,0.12); }
.card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.card-badge{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.08em; color: var(--teal);
}
.card-best-badge{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; color: var(--amber-deep);
  background: rgba(217,142,43,0.14); padding:3px 9px; border-radius:999px; white-space:nowrap;
}
.card-title{ font-family:'Fraunces', serif; font-weight:700; font-size:18px; color: var(--forest-deep); margin-bottom:6px; line-height:1.25; }
.card-sub{ font-size:12.5px; line-height:1.5; color: rgba(28,43,38,0.65); flex:1; margin-bottom:12px; }
.card-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.card-tag{ font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; }
.card-tag.pass{ background: rgba(63,138,124,0.15); color: var(--teal); }
.card-tag.progress{ background: rgba(192,71,58,0.12); color: var(--coral); }
.card-actions{ display:flex; flex-direction:column; gap:8px; margin-top:auto; }
.card-actions .btn{ width:100%; justify-content:center; padding:10px 16px; font-size:13.5px; }
.card-link{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--teal);
  text-decoration:underline; background:none; border:none; cursor:pointer; text-align:center; padding:2px;
}

/* -------- Quiz -------- */
.quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; gap:12px; }
.quiz-head .back{ background:none; border:none; cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--teal); padding:0; }
.progress-wrap{ flex:1; height:6px; background: var(--paper-dim); border-radius:4px; overflow:hidden; margin: 0 14px; }
.progress-bar{ height:100%; background: var(--amber); border-radius:4px; transition: width .2s ease; }
.qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--forest); flex:none; }

.qnum{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--teal); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
.qtext{ font-family:'Fraunces', serif; font-weight:700; font-size:21px; line-height:1.35; color: var(--forest-deep); margin-bottom:22px; }

.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  display:flex; align-items:flex-start; gap:14px;
  border:1.5px solid var(--line); border-radius:12px;
  padding: 14px 16px;
  cursor:pointer;
  background:#fffdf7;
  transition: border-color .12s ease, background .12s ease;
}
.option:hover{ border-color: var(--teal); }
.option.selected{ border-color: var(--forest); background: rgba(31,58,52,0.06); }
.bubble{
  font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px;
  width:28px; height:28px; flex:none; border-radius:50%;
  border: 1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color: var(--forest);
  background:#fff;
}
.option.selected .bubble{ background: var(--forest); border-color: var(--forest); color: var(--paper); }
.opt-text{ font-size:14.5px; line-height:1.5; padding-top:3px; color: var(--ink); }

/* review states */
.option.correct-answer{ border-color: var(--teal); background: rgba(63,138,124,0.10); }
.option.correct-answer .bubble{ background: var(--teal); border-color: var(--teal); color:#fff; }
.option.wrong-answer{ border-color: var(--coral); background: rgba(192,71,58,0.08); }
.option.wrong-answer .bubble{ background: var(--coral); border-color: var(--coral); color:#fff; }
.explain{
  margin-top:10px; font-size:13.5px; line-height:1.55; color: rgba(28,43,38,0.8);
  background: var(--paper-dim); border-left:3px solid var(--amber);
  padding: 10px 14px; border-radius: 0 8px 8px 0;
}

/* -------- Results -------- */
.score-hero{ text-align:center; padding: 10px 0 20px; }
.score-num{ font-family:'Fraunces', serif; font-weight:900; font-size:64px; color: var(--forest-deep); line-height:1; }
.score-num span{ font-size:28px; color: rgba(28,43,38,0.5); }
.score-label{ font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color: var(--teal); margin-top:8px; }
.stamp{
  display:inline-block; margin-top:14px; padding: 6px 16px; border-radius:999px;
  font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px;
  border: 1.5px dashed var(--amber-deep); color: var(--amber-deep); transform: rotate(-2deg);
}
.review-list{ display:flex; flex-direction:column; gap:16px; margin-top: 8px; }
.review-item{ border:1.5px solid var(--line); border-radius:12px; padding:16px 18px; background:#fffdf7; }
.review-item .qtext{ font-size:16px; margin-bottom:14px; }
.review-item .tag{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
  padding:2px 8px; border-radius:6px; margin-left:8px;
}
.tag.ok{ background: rgba(63,138,124,0.15); color: var(--teal); }
.tag.no{ background: rgba(192,71,58,0.15); color: var(--coral); }

/* -------- My Attempts -------- */
.lb-row{
  display:flex; align-items:center; gap:12px;
  padding: 10px 4px; border-bottom: 1px solid var(--line);
  font-size:14px;
}
.lb-row:last-child{ border-bottom:none; }
.lb-rank{ font-family:'IBM Plex Mono', monospace; font-weight:600; color: var(--teal); width:26px; }
.lb-name{ flex:1; font-weight:600; color: var(--forest-deep); }
.lb-score{ font-family:'IBM Plex Mono', monospace; color: var(--amber-deep); font-weight:600; }
.lb-empty{ font-size:13.5px; color: rgba(28,43,38,0.55); padding: 10px 4px; }

.section-title{ font-family:'Fraunces', serif; font-weight:700; font-size:17px; color: var(--forest-deep); margin: 26px 0 6px; }
.hint{ font-size:12.5px; color: rgba(28,43,38,0.55); margin-bottom:14px; }
</style>
</head>

<div class="app">
  <div class="brandbar">
    <div class="mark">Albytech <span>&middot;</span> Exam Prep</div>

  </div>
  <div class="sheet"><div class="sheet-inner" id="root"></div></div>
</div>

<script>
/* ============================================================
   QUESTION DATA FROM UENR202_STS_Answers.pdf
   ============================================================ */
function q(question, options, correct, explanation){
  return { question, options, correct, explanation };
}

const SLIDES = [
  {
    id: "lecture1a",
    order: 1,

      q("What does STS stand for in this course?",["Science, Technology and Sustainability","Science, Technology and Society","Systematic Technology Studies","Science, Theory and Society"],1,"STS stands for Science, Technology and Society - a field that examines the interrelationship between these three domains."),
      q("Which of these best describes STS as a field of study?",["A field that only tests new gadgets before release","An interdisciplinary field studying science, technology, and society interactions","A purely theoretical exercise","Only a business discipline"],1,"STS is an interdisciplinary field that examines how science and technology shape society and vice versa."),
      q("The historical roots of STS lie in:",["The Renaissance period","Ancient Greek philosophy","The interwar period (1920s-1930s)","Medieval times"],2,"The interwar period saw the emergence of STS as scholars began examining the relationship between science, technology, and society."),
      q("Who became interested in the relationship between scientific knowledge, technological systems, and society?",["Only government regulators","Historians and sociologists","Only engineers","Only physicists"],1,"Historians, sociologists, and social scientists became key contributors to early STS scholarship."),
      q("Thomas Kuhn's classic 1962 study that helped shape STS is titled:",["A Brief History of Time","The Origin of Species","The Structure of Scientific Revolutions","The Selfish Gene"],2,"Kuhn's 'The Structure of Scientific Revolutions' fundamentally changed how we understand scientific progress and paradigm shifts."),

      q("Which invention is attributed to Mesopotamia?",["Papermaking","The wheel and writing (cuneiform)","Gunpowder","The printing press"],1,"Ancient Mesopotamia is credited with inventing the wheel and developing cuneiform writing."),
      q("Which achievements are attributed to Ancient Egypt?",["The wheel and cuneiform writing","Pyramids and medicine","Papermaking and gunpowder","Algebra and heliocentric theory"],1,"Ancient Egypt is famous for constructing the pyramids and developing early medical practices."),
      q("Which achievements are attributed to Ancient China?",["Papermaking and gunpowder","The wheel and cuneiform writing","Pyramids and medicine","Aqueducts and roads"],0,"Ancient China is credited with inventing papermaking and gunpowder."),
    ]

  {

      q("The Industrial Revolution is described as a transition from:",["Industrial economies to agrarian economies","Agrarian economies to industrial economies","Digital economies to industrial economies","Hunter-gatherer to agrarian"],1,"The Industrial Revolution marked the shift from agrarian to industrial economies."),
      q("Which of these is listed as a key factor that led to the Industrial Revolution?",["Efficient agriculture and abundant natural capital","Only technological innovation","Only political stability","Only religious faith"],0,"Efficient agriculture was crucial in providing the capital and workforce needed for industrialization."),
      q("In the lecture's list of key factors, coal served primarily as:",["A building material for factories","A cheap fuel source for rail transportation of goods and services","A currency for paying workers","Only a decorative material"],1,"Coal was the primary fuel source that powered industrial machinery and transportation during this period."),
    ]
  },
  {

    title: "Lecture 4",

  userName: null,
  activeSlide: null,
  quizQuestions: [],
  currentIndex: 0,
  answers: [],
  myAttemptsView: null,
  lastScore: 0
};

const PASS_PCT = 0.8;

/* ============================================================
   STORAGE HELPERS
   ============================================================ */
const LS_PREFIX = 'stsQuiz:';

function lsGet(key){
  try{ return localStorage.getItem(LS_PREFIX + key); }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX + key, value); return true; }catch(e){ return false; }
}
function lsDelete(key){
  try{ localStorage.removeItem(LS_PREFIX + key); }catch(e){}
}

async function getName(){
  const v = lsGet('quizUserName');
  return v || null;
}
async function setName(name){
  lsSet('quizUserName', name);
}

async function getBestScores(){
  const v = lsGet('myBestScores');
  try{ return v ? JSON.parse(v) : {}; }catch(e){ return {}; }
}
async function setBestScore(slideId, score, total){
  const scores = await getBestScores();
  const passedNow = (score / total) >= PASS_PCT;
  const prev = scores[slideId];
  const bestScore = prev && prev.score > score ? prev.score : score;
  const everPassed = (prev && prev.passed) || passedNow;
  scores[slideId] = { score: bestScore, total, passed: everPassed };
  lsSet('myBestScores', JSON.stringify(scores));
  return scores[slideId];
}

async function getAttempts(slideId){
  const v = lsGet('attempts:' + slideId);
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function addAttempt(slideId, score, total){
  const attempts = await getAttempts(slideId);
  attempts.push({
    score, total,
    pct: Math.round((score/total)*100),
    passed: (score/total) >= PASS_PCT,
    ts: Date.now()
  });
  lsSet('attempts:' + slideId, JSON.stringify(attempts));
  return attempts;
}

async function saveInProgress(slideId, data){
  lsSet('inProgress:' + slideId, JSON.stringify(data));
}
async function getInProgress(slideId){
  const v = lsGet('inProgress:' + slideId);
  try{ return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function clearInProgress(slideId){
  lsDelete('inProgress:' + slideId);
}

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleOptions(question){
  const idxs = shuffle([0,1,2,3]);
  const options = idxs.map(i => question.options[i]);
  const correct = idxs.indexOf(question.correct);
  return { question: question.question, options, correct, explanation: question.explanation };
}

function getRealSlides(){
  return SLIDES.filter(s => s.questions.length > 0);
}

/* ============================================================
   RENDERING
   ============================================================ */
function render(){
  const root = document.getElementById('root');
  const who = document.getElementById('brandWho');
  
  if(STATE.screen === "loading"){
    root.innerHTML = `
      <div class="eyebrow">Welcome</div>
      <h1 class="title">STS Exam Prep</h1>
      <p class="lede">Enter your name to get started with the quiz.</p>
      <label class="field-label">Your name</label>
      <input type="text" class="textfield" id="nameInput" placeholder="E.g. Alex">
      <div class="btn-row">
        <button class="btn btn-primary" onclick="onNameSubmit()">Start</button>
      </div>
    `;
    who.textContent = '';
  }
  else if(STATE.screen === "menu"){
    const slides = getRealSlides();
    const bestScores = lsGet('myBestScores') ? JSON.parse(lsGet('myBestScores')) : {};
    
    let grid = '';
    for(const slide of slides){
      const best = bestScores[slide.id];
      const badge = best ? (best.passed ? '✓ Passed' : `${best.score}/${best.total}`) : 'Not attempted';
      const tagClass = best && best.passed ? 'pass' : 'progress';
      
      grid += `
        <div class="slide-card" onclick="onSelectSlide('${slide.id}')">
          <div class="card-top">
            <div class="card-badge">${slide.order}</div>
            ${best && best.passed ? `<div class="card-best-badge">✓ Passed</div>` : ''}
          </div>
          <div class="card-title">${slide.title}</div>
          <div class="card-sub">${slide.subtitle}</div>
          <div class="card-tags">
            <span class="card-tag ${tagClass}">${badge}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-amber">Start Quiz</button>
          </div>
        </div>
      `;
    }
    
    root.innerHTML = `
      <div class="welcome-row">
        <h1 class="title">Choose a lecture</h1>
        <button class="changer" onclick="onChangeName()">Change name</button>
      </div>
      <div class="slide-grid">${grid}</div>
    `;
    who.textContent = STATE.userName;
  }
  else if(STATE.screen === "quiz"){
    const slide = SLIDES.find(s => s.id === STATE.activeSlide);
    const q = STATE.quizQuestions[STATE.currentIndex];
    const progress = Math.round((STATE.currentIndex / STATE.quizQuestions.length) * 100);
    
    let optionsHtml = '';
    for(let i = 0; i < q.options.length; i++){
      const selected = STATE.answers[STATE.currentIndex] === i;
      optionsHtml += `
        <div class="option ${selected ? 'selected' : ''}" onclick="onSelectOption(${i})">
          <div class="bubble">${String.fromCharCode(65 + i)}</div>
          <div class="opt-text">${q.options[i]}</div>
        </div>
      `;
    }
    
    root.innerHTML = `
      <div class="quiz-head">
        <button class="back" onclick="onBackToMenu()">← Back</button>
        <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
        <div class="qcount">${STATE.currentIndex + 1}/${STATE.quizQuestions.length}</div>
      </div>
      <div class="qnum">Question ${STATE.currentIndex + 1}</div>
      <div class="qtext">${q.question}</div>
      <div class="options">${optionsHtml}</div>
      <div class="btn-row">
        ${STATE.currentIndex > 0 ? `<button class="btn btn-ghost" onclick="onPrevQ()">Previous</button>` : ''}
        <button class="btn btn-primary" onclick="onNextQ()" style="margin-left:auto;">${STATE.currentIndex === STATE.quizQuestions.length - 1 ? 'Submit' : 'Next'}</button>
      </div>
    `;
    who.textContent = STATE.userName;
  }
  else if(STATE.screen === "results"){
    const slide = SLIDES.find(s => s.id === STATE.activeSlide);
    const pct = Math.round((STATE.lastScore / STATE.quizQuestions.length) * 100);
    const passed = pct >= 80;
    
    let review = '';
    for(let i = 0; i < STATE.quizQuestions.length; i++){
      const q = STATE.quizQuestions[i];
      const ans = STATE.answers[i];
      const correct = q.correct;
      const isCorrect = ans === correct;
      
      review += `
        <div class="review-item">
          <div class="qtext">${q.question}<span class="tag ${isCorrect ? 'ok' : 'no'}">${isCorrect ? '✓' : '✗'}</span></div>
          <div>Your answer: <strong>${q.options[ans]}</strong></div>
          ${!isCorrect ? `<div>Correct: <strong>${q.options[correct]}</strong></div>` : ''}
          <div class="explain">${q.explanation}</div>
        </div>
      `;
    }
    
    root.innerHTML = `
      <div class="score-hero">
        <div class="score-num">${STATE.lastScore}<span>/${STATE.quizQuestions.length}</span></div>
        <div class="score-label">${pct}%</div>
        ${passed ? `<div class="stamp">Passed!</div>` : ''}
      </div>
      <div class="section-title">Review</div>
      <div class="review-list">${review}</div>
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn btn-ghost" onclick="onRetakeQuiz()">Retake</button>
        <button class="btn btn-primary" style="margin-left:auto;" onclick="onBackToMenu()">Back to menu</button>
      </div>
    `;
    who.textContent = STATE.userName;
  }
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
async function onNameSubmit(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return alert('Please enter your name');
  STATE.userName = name;
  await setName(name);
  STATE.screen = "menu";
  render();
}

function onChangeName(){
  STATE.screen = "loading";
  render();
}

function onSelectSlide(slideId){
  STATE.activeSlide = slideId;
  const slide = SLIDES.find(s => s.id === slideId);
  STATE.quizQuestions = slide.questions.map(q => shuffleOptions(q));
  STATE.currentIndex = 0;
  STATE.answers = new Array(STATE.quizQuestions.length).fill(null);
  STATE.screen = "quiz";
  render();
}

function onSelectOption(idx){
  STATE.answers[STATE.currentIndex] = idx;
  render();
}

function onNextQ(){
  if(STATE.currentIndex === STATE.quizQuestions.length - 1){
    onSubmitQuiz();
  } else {
    STATE.currentIndex++;
    render();
  }
}

function onPrevQ(){
  if(STATE.currentIndex > 0){
    STATE.currentIndex--;
    render();
  }
}

async function onSubmitQuiz(){
  let score = 0;
  for(let i = 0; i < STATE.quizQuestions.length; i++){
    if(STATE.answers[i] === STATE.quizQuestions[i].correct){
      score++;
    }
  }
  STATE.lastScore = score;
  await setBestScore(STATE.activeSlide, score, STATE.quizQuestions.length);
  STATE.screen = "results";
  render();
}

function onRetakeQuiz(){
  const slideId = STATE.activeSlide;
  const slide = SLIDES.find(s => s.id === slideId);
  STATE.quizQuestions = slide.questions.map(q => shuffleOptions(q));
  STATE.currentIndex = 0;
  STATE.answers = new Array(STATE.quizQuestions.length).fill(null);
  STATE.screen = "quiz";
  render();
}

function onBackToMenu(){
  STATE.screen = "menu";
  render();
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  const name = await getName();
  if(name){
    STATE.userName = name;
    STATE.screen = "menu";
  } else {
    STATE.screen = "loading";
  }
  render();
}

init();
</script>
</body>
</html>
